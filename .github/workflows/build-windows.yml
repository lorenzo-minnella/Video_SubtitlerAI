name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow

      - name: Genera l'icona .ico
        run: python tools/make_ico.py
        continue-on-error: true

      - name: Compila l'eseguibile con PyInstaller
        shell: pwsh
        run: |
          $args = @(
            '--noconfirm','--clean',
            '--name','VideoSubtitlerAI',
            '--windowed','--onedir',
            '--collect-all','customtkinter',
            '--collect-all','faster_whisper',
            '--collect-all','av',
            '--collect-all','ctranslate2',
            '--collect-all','tkinterdnd2',
            '--collect-all','argostranslate',
            '--collect-all','certifi',
            '--add-data','assets;assets'
          )
          if (Test-Path 'assets/icon/icon.ico') {
            $args += @('--icon','assets/icon/icon.ico')
            Write-Host 'Icona trovata: la includo.'
          } else {
            Write-Host 'Icona assente: compilo senza icona personalizzata.'
          }
          $args += 'app_gui.py'
          pyinstaller @args

      - name: Crea lo ZIP di distribuzione
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/VideoSubtitlerAI/*" -DestinationPath "VideoSubtitlerAI-win64.zip" -Force

      - name: Pubblica l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoSubtitlerAI-win64
          path: VideoSubtitlerAI-win64.zip

      - name: Pubblica la Release (solo sui tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VideoSubtitlerAI-win64.zip
